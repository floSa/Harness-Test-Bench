services:
  relais:                                   # seul service qui connaît la clé du portail
    image: python:3.12-slim
    command: python3 /relais.py
    env_file: .env
    volumes: ["./relais.py:/relais.py:ro"]
    networks: [interne, sortie]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"

  harnais:                                  # le harnais : réseau interne seulement, sans Internet
    build:
      context: .
      args: {UID_AGENT: "${UID_AGENT}"}
    environment:                            # variables données une à une : pas la clé du portail
      OPENAI_BASE_URL: http://relais:8080/v1
      OPENAI_API_KEY: ${CLE_LOCALE}
      MODELE: ${IAG_MODELE}
    volumes:
      - ./espace:/travail                   # seul dossier du poste visible
      - maison:/home/agent                  # configuration du harnais
    working_dir: /travail
    networks: [interne]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 8g
    pids_limit: 2048
    stdin_open: true
    tty: true
    depends_on: [relais]

networks:
  interne: {internal: true}                 # aucune route vers l'extérieur
  sortie: {}

volumes:
  maison: {}
