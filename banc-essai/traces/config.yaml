# Modèle de la campagne 1 (protocole, section 2) ; le nom exposé aux harnais est « deepseek-v4.1-flash ».
# Version figée (instantané du 17/10/2026) et fournisseur unique chez OpenRouter (Pearl Research, fp8),
# sans repli vers un autre fournisseur : même modèle exact pour tous les essais, cache utilisable.
# Prix du fournisseur (relevés le 19/11/2026, dollars par jeton) donnés au relais : sans eux, LiteLLM
# ne calcule aucun coût et le plafond par clé ne bloque rien.
model_list:
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      api_key: os.environ/BANC_OPENROUTER_KEY
      extra_body:
        provider:
          order: ["pearl-research"]
          allow_fallbacks: false
        usage:
          include: true
      input_cost_per_token: 5.0e-08
      output_cost_per_token: 3.0e-07
      cache_read_input_token_cost: 3.0e-09

litellm_settings:
  callbacks: journal_appels.journal
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Dépense des clés écrite en base toutes les 1 à 6 s (au lieu de 10 à 15 s) : lancer.sh la relit
  # 10 s après la fin de l'essai pour la comparer au journal.
  proxy_batch_write_at: 1

# Un seul déploiement : pas de mise en pause après une erreur (le harnais doit recevoir le vrai 429,
# mesuré par le protocole), pas de nouvelle tentative cachée par le relais.
router_settings:
  disable_cooldowns: true
  num_retries: 0
